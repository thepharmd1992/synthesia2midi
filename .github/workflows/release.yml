name: Release

on:
  push:
    branches:
      - "codex/*-preflight"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the non-publishing package build"
        required: true
        default: "v0.2.2-dev"

permissions:
  contents: write

env:
  FFMPEG_CHOCO_VERSION: "9.0.1"
  PYTHONPATH: synthesia2midi
  QT_QPA_PLATFORM: offscreen

jobs:
  create-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release if missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  build-and-upload:
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install FFmpeg
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install ffmpeg --version="$FFMPEG_CHOCO_VERSION" -y --no-progress
          else
            brew install ffmpeg
          fi

      - name: Setup repo environment
        shell: bash
        run: python setup_env.py --dev

      - name: Resolve build version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUILD_VERSION="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_VERSION="$GITHUB_REF_NAME"
          else
            BUILD_VERSION="$(python -c 'from synthesia2midi.version import DEFAULT_APP_VERSION; print(DEFAULT_APP_VERSION)')"
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Build packaged release
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python.exe packaging/build_release.py --version "$BUILD_VERSION"
          else
            .venv/bin/python packaging/build_release.py --version "$BUILD_VERSION"
          fi

      - name: Create stable latest archive alias
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp dist/release/Synthesia2MIDI-windows-x64-v*.zip \
              dist/release/Synthesia2MIDI-windows-x64-latest.zip
          else
            cp dist/release/Synthesia2MIDI-macos-arm64-v*.zip \
              dist/release/Synthesia2MIDI-macos-arm64-latest.zip
          fi

      - name: Upload packaged archive to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/release/*.zip --clobber

      - name: Upload preflight package artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Synthesia2MIDI-${{ runner.os }}-${{ github.sha }}
          path: dist/release/*.zip
          if-no-files-found: error
          retention-days: 7
